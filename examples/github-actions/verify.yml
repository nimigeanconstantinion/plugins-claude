# Verificare independenta: build + teste (Testcontainers merge pe ubuntu-latest, Docker e preinstalat).
name: Claude verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# shell: bash = bash -eo pipefail: un esec al lui claude nu e ascuns de `| tee`.
defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: nimigeanconstantinion/plugins-claude/.github/actions/setup-claude@main
        with:
          plugins: verify

      - name: Verificare
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::Lipseste secretul ANTHROPIC_API_KEY sau CLAUDE_CODE_OAUTH_TOKEN (gol sau nesetat)"; exit 1; }
          OUT="$RUNNER_TEMP/claude"
          mkdir -p "$OUT"
          claude -p "/verify:run {\"service\":\".\",\"outDir\":\"$OUT\"}" \
            --allowedTools "Workflow Agent Skill Read Grep Glob Write Bash" \
            | tee "$OUT/stdout.txt"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Rezumat
        if: always() && env.OUT != ''
        run: if [ -f "$OUT/verify.md" ]; then cat "$OUT/verify.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Verdict
        run: '[ "$(jq -r .verdict "$OUT/verify.json" 2>/dev/null)" = "pass" ]'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-verify
          path: ${{ env.OUT }}
